# A bootable Debian 13 for runners: the kernel and initramfs the adapter boots
# directly (so no boot loader), systemd as init, cloud-init for the runner's
# seed, and DHCP and DNS on its network card. The other images include it
# (Include=base) and add their software.
[Distribution]
Distribution=debian
Release=trixie

[Content]
Bootable=no
Packages=
        initramfs-tools
        systemd-sysv
        systemd-resolved
        udev
        dbus
        cloud-init
        e2fsprogs
        python3
        ca-certificates
        iproute2
        netbase
