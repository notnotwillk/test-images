bundle: 1
name: knowledge-base
description: The control plane's knowledge base, on a runner, exposed on the mesh
params:
  runner: { default: knowledge-base, description: The runner's name }
  memory: { default: 512M }
  exposure: { default: knowledge-base, description: "Its name on the mesh, which must be unique there" }
recipes:
  - name: knowledge-base
    tool: mkosi
    git: { path: knowledge-base }
profiles:
  - name: ${runner}
    image: recipe:knowledge-base
    memory: ${memory}
runners:
  - { name: "${runner}", profile: "${runner}" }
exposures:
  - { name: "${exposure}", runner: "${runner}", port: 80 }
