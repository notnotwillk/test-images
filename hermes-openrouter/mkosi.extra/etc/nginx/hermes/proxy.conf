# A key: Hermes, which listens only on loopback, so it needs no login of its own.
# It refuses a Host or Origin other than the address it's bound to, as protection
# against DNS rebinding, so both are rewritten here.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /var/www/hermes;
  location / {
    proxy_pass http://127.0.0.1:9119;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:9119;
    proxy_set_header Origin http://127.0.0.1:9119;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The Chat tab is one long WebSocket.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
    error_page 502 503 504 =200 /starting.html;
  }
  location = /starting.html {
    internal;
    add_header Cache-Control no-store always;
  }
}
