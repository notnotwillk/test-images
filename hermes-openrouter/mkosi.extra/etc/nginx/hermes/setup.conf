# No key yet: every path is the setup page. Its script watches for this header
# going away, which means Hermes has taken over.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /var/www/hermes;
  add_header X-Hermes-Setup needed always;
  add_header Cache-Control no-store always;
  location / { try_files /setup.html =404; }
}
