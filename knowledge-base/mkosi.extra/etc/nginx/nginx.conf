# The knowledge base's whole nginx configuration: one site on port 80.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/knowledge-base;
    location / { try_files $uri $uri/ =404; }
    # The pages' Markdown sources, shown as text rather than downloaded.
    location ~ \.md$ { default_type text/plain; try_files $uri =404; }
  }
}
