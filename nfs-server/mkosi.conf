# An NFS server: /srv/nfs over NFSv4.1 and 4.2, on TCP port 2049 only.
# A runner image: Debian 13 with the kernel and initramfs the adapter boots
# directly (so no boot loader), systemd as init, cloud-init for the runner's
# seed, and DHCP and DNS on its network card, as base/ is. The kernel package
# depends on the architecture: see mkosi.conf.d/.
[Distribution]
Distribution=debian
Release=trixie

[Content]
Bootable=no
Packages=
        initramfs-tools
        systemd-sysv
        systemd-resolved
        udev
        dbus
        cloud-init
        e2fsprogs
        python3
        ca-certificates
        iproute2
        netbase
        nfs-kernel-server
