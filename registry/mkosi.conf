# An OCI registry runner: Debian 13 that boots as a Buzz Herd runner, with
# Debian's docker-registry (CNCF distribution) on port 5000, storing images on
# the runner's disk. The mkosi version of boxlab's runner-images/registry.
#
# A runner image needs systemd as init, cloud-init, and exactly one kernel and
# initramfs in /boot, which the adapter boots directly: so no boot loader
# (Bootable=no). The adapter builds it with --format oci. The kernel package
# depends on the architecture: see mkosi.conf.d/.
[Distribution]
Distribution=debian
Release=trixie

[Content]
Bootable=no
Packages=
        initramfs-tools
        systemd-sysv
        systemd-resolved
        udev
        dbus
        cloud-init
        e2fsprogs
        python3
        ca-certificates
        iproute2
        netbase
        docker-registry
